# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on Linux Platform

on:
  push:
    paths-ignore:
      - '.github/workflows/cmake-win.yml'
      - '.vscode'
  pull_request:
    paths-ignore:
      - '.github/workflows/cmake-win.yml'
      - '.vscode'

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug
  BUILD_DIR: Build_Linux

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Update env
      run: sudo apt-get update -y

    - name: Install Linux prequisities
      run: sudo apt install build-essential libgl1-mesa-dev mesa-common-dev libxi-dev libglu1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libgtk-3-0 libgtk-3-dev libglfw3-dev libx11-dev

    - name: Update gcc
      run: sudo apt install g++ g++-14 gcc-14 && sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 800 --slave /usr/bin/g++ g++ /usr/bin/g++-14

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      working-directory: ${{github.workspace}}
      run: cmake -S . -B ${{env.BUILD_DIR}} -DENABLE_TRACY=OFF -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_POLICY_VERSION_MINIMUM="3.5"

    - name: Build Projects
      # Build your program with the given configuration
      working-directory: ${{github.workspace}}
      run: cmake --build ${{env.BUILD_DIR}} --config ${{env.BUILD_TYPE}} --parallel 14 --target WxWidgetsTemplateApp_console
